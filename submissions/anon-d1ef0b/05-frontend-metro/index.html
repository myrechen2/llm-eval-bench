<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地铁线路规划器 · Metro Planner</title>
<style>
  :root {
    --bg: #f4f6fa;
    --surface: #ffffff;
    --surface-2: #f8fafc;
    --surface-hover: #eef2f7;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;
    --text: #0f172a;
    --text-2: #475569;
    --text-3: #64748b;
    --accent: #2563eb;
    --accent-soft: #eff6ff;
    --accent-text: #1d4ed8;
    --origin: #10b981;
    --dest: #ef4444;
    --map-bg: #fafbfd;
    --map-grid: rgba(148, 163, 184, 0.14);
    --halo: #fafbfd;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.09);
    --radius: 12px;
    --radius-sm: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1120;
      --surface: #111827;
      --surface-2: #1e293b;
      --surface-hover: #263348;
      --border: #253247;
      --border-strong: #374863;
      --text: #f1f5f9;
      --text-2: #cbd5e1;
      --text-3: #94a3b8;
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --accent-text: #93c5fd;
      --origin: #34d399;
      --dest: #f87171;
      --map-bg: #0f172a;
      --map-grid: rgba(148, 163, 184, 0.08);
      --halo: #0f172a;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b1120;
    --surface: #111827;
    --surface-2: #1e293b;
    --surface-hover: #263348;
    --border: #253247;
    --border-strong: #374863;
    --text: #f1f5f9;
    --text-2: #cbd5e1;
    --text-3: #94a3b8;
    --accent: #3b82f6;
    --accent-soft: rgba(59, 130, 246, 0.16);
    --accent-text: #93c5fd;
    --origin: #34d399;
    --dest: #f87171;
    --map-bg: #0f172a;
    --map-grid: rgba(148, 163, 184, 0.08);
    --halo: #0f172a;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.45);
  }

  *, *::before, *::after {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: 380px minmax(0, 1fr);
    height: 100vh;
    width: 100%;
    max-width: 100vw;
    overflow: hidden;
  }

  /* Sidebar */
  .sidebar {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-right: 1px solid var(--border);
    height: 100vh;
    min-width: 0;
    overflow: hidden;
    z-index: 10;
  }

  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 10px rgba(37, 99, 235, 0.28);
  }

  .brand-text {
    min-width: 0;
  }

  .brand-title {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand-sub {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-3);
  }

  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.12s;
  }

  .icon-btn:hover {
    background: var(--surface-hover);
    border-color: var(--border-strong);
    color: var(--text);
  }

  .icon-btn:active {
    transform: scale(0.95);
  }

  .icon-btn:focus-visible,
  button:focus-visible,
  input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* Planner form */
  .planner-box {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }

  .inputs-grid {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 36px;
    gap: 8px;
    align-items: center;
  }

  .input-stack {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
  }

  .field-wrap {
    position: relative;
    min-width: 0;
  }

  .field-dot {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 10px;
    height: 10px;
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 0 3px var(--surface);
  }

  .field-dot.origin { background: var(--origin); }
  .field-dot.dest { background: var(--dest); }

  .station-input {
    width: 100%;
    height: 40px;
    padding: 0 32px 0 32px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }

  .station-input::placeholder {
    color: var(--text-3);
  }

  .station-input:focus {
    border-color: var(--accent);
    background: var(--surface);
    box-shadow: 0 0 0 3px var(--accent-soft);
    outline: none;
  }

  .clear-field {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: transparent;
    color: var(--text-3);
    width: 24px;
    height: 24px;
    border-radius: 6px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    line-height: 1;
  }

  .clear-field.visible {
    display: inline-flex;
  }

  .clear-field:hover {
    background: var(--surface-hover);
    color: var(--text);
  }

  .suggestions {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    max-height: 220px;
    overflow-y: auto;
    z-index: 40;
    display: none;
    list-style: none;
    margin: 0;
    padding: 4px;
  }

  .suggestions.open {
    display: block;
  }

  .suggestion-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
  }

  .suggestion-item:hover,
  .suggestion-item.highlighted {
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  .suggestion-lines {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }

  .mini-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  #swap-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s, transform 0.2s;
  }

  #swap-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--border-strong);
  }

  #swap-btn:active {
    transform: rotate(180deg);
  }

  .mode-bar {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
    padding: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }

  .mode-btn {
    border: none;
    background: transparent;
    color: var(--text-2);
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }

  .mode-btn:hover:not(.active) {
    color: var(--text);
    background: var(--surface-hover);
  }

  .mode-btn.active {
    background: var(--surface);
    color: var(--accent-text);
    box-shadow: var(--shadow-sm);
  }

  /* Scrollable content area in sidebar */
  .sidebar-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }

  /* Route summary */
  #route-summary {
    min-width: 0;
  }

  .empty-state {
    padding: 18px 14px;
    border: 1px dashed var(--border-strong);
    border-radius: var(--radius);
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 13px;
    line-height: 1.6;
  }

  .empty-state .empty-title {
    color: var(--text);
    display: block;
    margin-bottom: 4px;
    font-size: 13.5px;
    font-weight: 700;
  }

  .empty-state strong {
    color: var(--text);
  }

  .error-state {
    padding: 16px 14px;
    border: 1px solid rgba(239, 68, 68, 0.35);
    border-radius: var(--radius);
    background: rgba(239, 68, 68, 0.08);
    color: var(--text);
    font-size: 13px;
    line-height: 1.55;
  }

  .error-state strong {
    color: var(--dest);
    display: block;
    margin-bottom: 4px;
  }

  .summary-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface-2);
    overflow: hidden;
    animation: fadeSlide 0.2s ease-out;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .summary-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }

  .metric {
    background: var(--surface);
    padding: 12px 10px;
    text-align: center;
  }

  .metric-val {
    font-size: 19px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.02em;
    line-height: 1.2;
  }

  .metric-val span {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-3);
    margin-left: 2px;
  }

  .metric-label {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 3px;
  }

  .legs-list {
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--surface);
  }

  .leg-card {
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr);
    gap: 10px;
  }

  .leg-rail {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 4px;
  }

  .rail-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 2.5px solid var(--line-color, var(--accent));
    background: var(--surface);
    flex-shrink: 0;
  }

  .rail-bar {
    width: 4px;
    flex: 1;
    min-height: 36px;
    border-radius: 2px;
    background: var(--line-color, var(--accent));
    margin: 2px 0;
  }

  .leg-body {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .leg-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .line-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: var(--line-color, var(--accent));
    line-height: 1.5;
  }

  .leg-meta {
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
  }

  .leg-endpoints {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .leg-arrow {
    color: var(--text-3);
    font-weight: 400;
  }

  .leg-stops-detail {
    font-size: 12px;
    color: var(--text-3);
    line-height: 1.5;
  }

  .transfer-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 12.5px;
    color: var(--text-2);
  }

  .transfer-icon {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--accent-text);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 700;
  }

  /* Legend */
  .legend-section {
    border-top: 1px solid var(--border);
    padding-top: 12px;
  }

  .section-title {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-3);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .legend-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }

  .legend-chip:hover {
    background: var(--surface-hover);
    border-color: var(--border-strong);
  }

  .legend-chip.active {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent-text);
  }

  .legend-swatch {
    width: 12px;
    height: 4px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  /* Map stage */
  .map-stage {
    position: relative;
    background: var(--map-bg);
    background-image:
      linear-gradient(to right, var(--map-grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--map-grid) 1px, transparent 1px);
    background-size: 32px 32px;
    height: 100vh;
    min-width: 0;
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }

  #metro-svg {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
  }

  #metro-svg.panning {
    cursor: grabbing;
  }

  .map-controls {
    position: absolute;
    right: 16px;
    bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 5;
  }

  .map-ctrl-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    box-shadow: var(--shadow-sm);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s;
  }

  .map-ctrl-btn:hover {
    background: var(--surface-hover);
    border-color: var(--border-strong);
  }

  .map-hint {
    position: absolute;
    left: 16px;
    bottom: 16px;
    padding: 6px 12px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    font-size: 12px;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: none;
    max-width: calc(100% - 84px);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .hint-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* SVG styles */
  .track-group {
    transition: opacity 0.22s ease;
  }

  .track-group.dimmed {
    opacity: 0.18;
  }

  .route-flow {
    stroke-dasharray: 10 10;
    animation: flowDash 1.1s linear infinite;
    pointer-events: none;
  }

  @keyframes flowDash {
    from { stroke-dashoffset: 20; }
    to { stroke-dashoffset: 0; }
  }

  .station-node {
    cursor: pointer;
    transition: opacity 0.22s ease;
  }

  .station-node.dimmed {
    opacity: 0.28;
  }

  .station-node:hover .station-dot {
    transform: scale(1.22);
  }

  .station-dot {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.14s ease;
  }

  .station-label {
    font-family: var(--font);
    fill: var(--text);
    paint-order: stroke;
    stroke: var(--halo);
    stroke-linejoin: round;
    pointer-events: none;
    user-select: none;
  }

  .station-label.transfer-label {
    font-weight: 700;
  }

  .pin-pulse {
    transform-box: fill-box;
    transform-origin: center;
    animation: pulseRing 1.8s ease-out infinite;
    pointer-events: none;
  }

  @keyframes pulseRing {
    0% { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(2.15); opacity: 0; }
  }

  /* Responsive Mobile (<= 820px) */
  @media (max-width: 820px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto;
      height: auto;
      min-height: 100vh;
      overflow: visible;
    }

    .sidebar {
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
      overflow: visible;
      order: 1;
    }

    .sidebar-header {
      padding: 12px 14px;
    }

    .planner-box {
      padding: 12px 14px;
    }

    .sidebar-scroll {
      overflow: visible;
      padding: 12px 14px 16px;
    }

    .map-stage {
      height: 54vh;
      min-height: 340px;
      max-height: 520px;
      order: 2;
      border-top: 1px solid var(--border);
    }

    .map-hint {
      font-size: 11px;
      left: 10px;
      bottom: 10px;
      padding: 5px 10px;
    }

    .map-controls {
      right: 10px;
      bottom: 10px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" aria-label="路线规划面板">
    <header class="sidebar-header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="14" rx="4"></rect>
            <path d="M4 11h16"></path>
            <circle cx="8.5" cy="14" r="1"></circle>
            <circle cx="15.5" cy="14" r="1"></circle>
            <path d="M8 17l-2 4"></path>
            <path d="M16 17l2 4"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1 class="brand-title" id="network-title">滨海市轨道交通</h1>
          <p class="brand-sub" id="network-stats">37 站 · 5 条线路</p>
        </div>
      </div>
      <button type="button" class="icon-btn" id="theme-btn" title="切换深浅色主题" aria-label="切换深浅色主题">
        <svg id="theme-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
      </button>
    </header>

    <section class="planner-box" aria-label="起终点与模式选择">

        "times": [4,3,3,3,3,5,4,3,3,4,3,3]
      },
      {

        "stations": ["S40","S41","S42","S11","S43","S25","S44","S19"],
        "times": [2,2,2,2,2,3,4]
      }
    ]
  };

  // =========================================================================
  // Core Graph Index & Lexicographic Dijkstra Routing Engine
  // =========================================================================
  class MinHeap {
    constructor() {
      this.a = [];
    }
    get size() { return this.a.length; }
    push(node, p, s) {
      const a = this.a;
      let i = a.length;
      a.push({ node, p, s });
      while (i > 0) {
        const parent = (i - 1) >> 1;
        const pa = a[parent];
        if (pa.p < p || (pa.p === p && pa.s <= s)) break;
        a[i] = pa;
        i = parent;
      }
      a[i] = { node, p, s };
    }
    pop() {
      const a = this.a;
      const top = a[0];
      const last = a.pop();
      const n = a.length;
      if (n > 0) {
        let i = 0;
        while (true) {
          let l = (i << 1) + 1;
          let r = l + 1;
          let smallest = i;
          if (l < n) {
            const al = a[l];
            if (al.p < last.p || (al.p === last.p && al.s < last.s)) smallest = l;
          }
          if (r < n) {
            const ar = a[r];
            const sm = smallest === i ? last : a[smallest];
            if (ar.p < sm.p || (ar.p === sm.p && ar.s < sm.s)) smallest = r;
          }
          if (smallest === i) break;
          a[i] = a[smallest];
          i = smallest;
        }
        a[i] = last;
      }
      return top;
    }
  }

  function buildGraph(network) {
    const stations = Array.isArray(network.stations) ? network.stations : [];
    const lines = Array.isArray(network.lines) ? network.lines : [];
    const defaultTransfer = typeof network.transferTime === "number" ? network.transferTime : 0;

    const stationById = new Map();
    const stationIdxById = new Map();
    const linesAtStation = stations.map(() => []);
    stations.forEach((st, idx) => {
      stationById.set(st.id, st);
      stationIdxById.set(st.id, idx);
    });

    const lineById = new Map();
    lines.forEach((ln) => lineById.set(ln.id, ln));

    // Create hub node per station: id = 0 .. N-1
    // Create (stationIdx, lineIdx) nodes: id = N .. totalNodes-1
    const N = stations.length;
    const nodeStation = [];
    const nodeLine = []; // -1 for hub
    const adj = [];      // adj[u] = array of { to, time, transfer }

    for (let s = 0; s < N; s++) {
      nodeStation.push(s);
      nodeLine.push(-1);
      adj.push([]);
    }

    const stationLineNode = new Map(); // key = s * L + l -> nodeId
    const L = Math.max(1, lines.length);

    function getOrCreateSLNode(sIdx, lIdx) {
      const key = sIdx * L + lIdx;
      let id = stationLineNode.get(key);
      if (id !== undefined) return id;
      id = nodeStation.length;
      stationLineNode.set(key, id);
      nodeStation.push(sIdx);
      nodeLine.push(lIdx);
      adj.push([]);
      linesAtStation[sIdx].push({ lineIdx: lIdx, nodeId: id });
      return id;
    }

    // Track segment times for UI display: key = `${lineId}|${uId}|${vId}` -> min time
    const segTimeMap = new Map();

    for (let lIdx = 0; lIdx < lines.length; lIdx++) {
      const line = lines[lIdx];
      const stIds = line.stations || [];
      const times = line.times || [];
      const m = stIds.length;
      if (m === 0) continue;

      for (let i = 0; i < m; i++) {
        const sIdx = stationIdxById.get(stIds[i]);
        if (sIdx !== undefined) getOrCreateSLNode(sIdx, lIdx);
      }

      const edgeCount = line.loop ? m : Math.max(0, m - 1);
      for (let i = 0; i < edgeCount; i++) {
        const uId = stIds[i];
        const vId = stIds[(i + 1) % m];
        const uIdx = stationIdxById.get(uId);
        const vIdx = stationIdxById.get(vId);
        if (uIdx === undefined || vIdx === undefined) continue;
        const w = typeof times[i] === "number" ? times[i] : 0;
        const uNode = getOrCreateSLNode(uIdx, lIdx);
        const vNode = getOrCreateSLNode(vIdx, lIdx);
        adj[uNode].push({ to: vNode, time: w, transfer: 0 });
        adj[vNode].push({ to: uNode, time: w, transfer: 0 });

        const k1 = `${line.id}|${uId}|${vId}`;
        const k2 = `${line.id}|${vId}|${uId}`;
        if (!segTimeMap.has(k1) || w < segTimeMap.get(k1)) segTimeMap.set(k1, w);
        if (!segTimeMap.has(k2) || w < segTimeMap.get(k2)) segTimeMap.set(k2, w);
      }
    }

    // Connect (s, l) <-> HUB(s) when >= 2 lines meet at s
    const transferCostByStation = new Array(N);
    for (let sIdx = 0; sIdx < N; sIdx++) {
      const st = stations[sIdx];
      const tCost = typeof st.transferTime === "number" ? st.transferTime : defaultTransfer;
      transferCostByStation[sIdx] = tCost;
      const sls = linesAtStation[sIdx];
      if (sls.length >= 2) {
        for (let k = 0; k < sls.length; k++) {
          const slNode = sls[k].nodeId;
          adj[slNode].push({ to: sIdx, time: tCost, transfer: 1 });
          adj[sIdx].push({ to: slNode, time: 0, transfer: 0 });
        }
      }
    }

    return {
      network,
      stations,
      lines,
      stationById,
      stationIdxById,
      lineById,
      linesAtStation,
      transferCostByStation,
      segTimeMap,
      nodeStation,
      nodeLine,
      adj
    };
  }

  function computeRoute(graph, fromId, toId, mode) {
    const startIdx = graph.stationIdxById.get(fromId);
    const endIdx = graph.stationIdxById.get(toId);
    if (startIdx === undefined || endIdx === undefined) return null;
    if (fromId === toId) {
      return { totalTime: 0, transfers: 0, path: [fromId], legs: [] };
    }

    const startSLs = graph.linesAtStation[startIdx];
    const endSLs = graph.linesAtStation[endIdx];
    if (startSLs.length === 0 || endSLs.length === 0) return null;

    const byTransfers = mode === "transfers";
    const totalNodes = graph.adj.length;
    const distP = new Float64Array(totalNodes);
    const distS = new Float64Array(totalNodes);
    const parent = new Int32Array(totalNodes);
    const visited = new Uint8Array(totalNodes);
    distP.fill(Infinity);
    distS.fill(Infinity);
    parent.fill(-1);

    const heap = new MinHeap();
    for (let i = 0; i < startSLs.length; i++) {
      const u = startSLs[i].nodeId;
      distP[u] = 0;
      distS[u] = 0;
      heap.push(u, 0, 0);
    }

    let goalNode = -1;
    const adj = graph.adj;
    const nodeStation = graph.nodeStation;
    const nodeLine = graph.nodeLine;

    while (heap.size > 0) {
      const cur = heap.pop();
      const u = cur.node;
      if (visited[u]) continue;
      visited[u] = 1;

      if (nodeStation[u] === endIdx && nodeLine[u] !== -1) {
        goalNode = u;
        break;
      }

      const edges = adj[u];
      for (let i = 0; i < edges.length; i++) {
        const e = edges[i];
        const v = e.to;
        if (visited[v]) continue;
        const np = cur.p + (byTransfers ? e.transfer : e.time);
        const ns = cur.s + (byTransfers ? e.time : e.transfer);
        if (np < distP[v] || (np === distP[v] && ns < distS[v])) {
          distP[v] = np;
          distS[v] = ns;
          parent[v] = u;
          heap.push(v, np, ns);
        }
      }
    }

    if (goalNode === -1) return null;

    const totalTime = byTransfers ? distS[goalNode] : distP[goalNode];
    const transfers = byTransfers ? distP[goalNode] : distS[goalNode];

    // Reconstruct node sequence (excluding HUB nodes)
    const seq = [];
    for (let cur = goalNode; cur !== -1; cur = parent[cur]) {
      if (nodeLine[cur] !== -1) seq.push(cur);
    }
    seq.reverse();

    const path = [];
    const legs = [];
    let currentLeg = null;

    for (let i = 0; i < seq.length; i++) {
      const u = seq[i];
      const stId = graph.stations[nodeStation[u]].id;
      const lineId = graph.lines[nodeLine[u]].id;

      if (path.length === 0 || path[path.length - 1] !== stId) {
        path.push(stId);
      }

      if (!currentLeg) {
        currentLeg = { line: lineId, from: stId, to: stId };
      } else if (currentLeg.line === lineId) {
        currentLeg.to = stId;
      } else {
        if (currentLeg.from !== currentLeg.to) legs.push(currentLeg);
        currentLeg = { line: lineId, from: stId, to: stId };
      }
    }
    if (currentLeg && currentLeg.from !== currentLeg.to) {
      legs.push(currentLeg);
    }

    return {
      totalTime: Math.round(totalTime),
      transfers: Math.round(transfers),
      path,
      legs
    };
  }

  // =========================================================================
  // Application State
  // =========================================================================
  let graph = buildGraph(DEFAULT_NETWORK);
  let state = {
    originId: null,
    destId: null,
    mode: "time", // "time" | "transfers"
    currentRoute: null,
    activeLineId: null, // legend highlight
    theme: "auto" // "auto" | "light" | "dark"
  };

  // SVG viewport transform state
  const view = {
    baseX: 0, baseY: 0, baseW: 1000, baseH: 700,
    scale: 1, tx: 0, ty: 0,
    minScale: 0.55, maxScale: 4.5,
    isPanning: false, moved: false,
    startX: 0, startY: 0, startTx: 0, startTy: 0
  };

  // DOM Elements
  const elTitle = document.getElementById("network-title");
  const elStats = document.getElementById("network-stats");
  const elOriginInput = document.getElementById("origin-input");
  const elDestInput = document.getElementById("destination-input");
  const elOriginSug = document.getElementById("origin-suggestions");
  const elDestSug = document.getElementById("dest-suggestions");
  const elClearOrigin = document.getElementById("clear-origin");
  const elClearDest = document.getElementById("clear-dest");
  const elSwapBtn = document.getElementById("swap-btn");
  const elModeTime = document.getElementById("mode-time");
  const elModeTransfers = document.getElementById("mode-transfers");
  const elSummary = document.getElementById("route-summary");
  const elLegend = document.getElementById("line-legend");
  const elThemeBtn = document.getElementById("theme-btn");

  const svg = document.getElementById("metro-svg");
  const gViewport = document.getElementById("viewport");
  const layerTracks = document.getElementById("layer-tracks");
  const layerRoute = document.getElementById("layer-route");
  const layerStations = document.getElementById("layer-stations");
  const layerLabels = document.getElementById("layer-labels");
  const layerPins = document.getElementById("layer-pins");

  const SVG_NS = "http://www.w3.org/2000/svg";
  function svgEl(tag, attrs) {
    const el = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      for (const k in attrs) el.setAttribute(k, String(attrs[k]));
    }
    return el;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // =========================================================================
  // SVG Map Rendering (Adaptive Scaling, Parallel Offsets, Smart Labels)
  // =========================================================================
  let mapMetrics = { unit: 1, strokeW: 5, stationR: 5.5, transferR: 7.5, fontSize: 12 };
  let renderedLineGroups = new Map();
  let renderedStationGroups = new Map();
  let stationLabelDir = new Map();

  function computeMapLayout() {
    const sts = graph.stations;
    if (sts.length === 0) {
      view.baseX = 0; view.baseY = 0; view.baseW = 1000; view.baseH = 700;
      mapMetrics = { unit: 1, strokeW: 5, stationR: 5.5, transferR: 7.5, fontSize: 12 };
      return;
    }

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const st of sts) {
      if (st.x < minX) minX = st.x;
      if (st.x > maxX) maxX = st.x;
      if (st.y < minY) minY = st.y;
      if (st.y > maxY) maxY = st.y;
    }

    const spanX = Math.max(maxX - minX, 100);
    const spanY = Math.max(maxY - minY, 100);
    const diag = Math.hypot(spanX, spanY);
    const scaleFactor = diag / 1100;

    // Estimate typical adjacent segment length so dense large networks stay neat
    let segLens = [];
    for (const ln of graph.lines) {
      const arr = ln.stations || [];
      const ec = ln.loop ? arr.length : Math.max(0, arr.length - 1);
      for (let i = 0; i < ec; i++) {
        const a = graph.stationById.get(arr[i]);
        const b = graph.stationById.get(arr[(i + 1) % arr.length]);
        if (a && b) {
          const d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d > 0) segLens.push(d);
        }
      }
    }
    segLens.sort((a, b) => a - b);
    const medianSeg = segLens.length ? segLens[Math.floor(segLens.length / 2)] : 80;
    const baseUnit = Math.max(0.45, Math.min(scaleFactor, medianSeg / 58));

    const padX = Math.max(spanX * 0.1, 68 * baseUnit);
    const padY = Math.max(spanY * 0.12, 64 * baseUnit);

    view.baseX = minX - padX;
    view.baseY = minY - padY;
    view.baseW = spanX + padX * 2;
    view.baseH = spanY + padY * 2;

    mapMetrics = {
      unit: baseUnit,
      strokeW: Math.max(2.6, 5.2 * baseUnit),
      stationR: Math.max(3.2, 5.4 * baseUnit),
      transferR: Math.max(4.6, 7.6 * baseUnit),
      fontSize: Math.max(7.5, Math.min(13.5 * baseUnit, medianSeg * 0.24))
    };
  }

  function buildEdgeParallelOffsets() {
    // Count how many lines traverse each undirected edge {u, v}
    const edgeLines = new Map();
    for (let lIdx = 0; lIdx < graph.lines.length; lIdx++) {
      const ln = graph.lines[lIdx];
      const arr = ln.stations || [];
      const ec = ln.loop ? arr.length : Math.max(0, arr.length - 1);
      for (let i = 0; i < ec; i++) {
        const u = arr[i], v = arr[(i + 1) % arr.length];
        const key = u < v ? `${u}|${v}` : `${v}|${u}`;
        if (!edgeLines.has(key)) edgeLines.set(key, []);
        edgeLines.get(key).push(ln.id);
      }
    }
    return edgeLines;
  }

  function getOffsetSegment(a, b, lineId, edgeLines) {
    const key = a.id < b.id ? `${a.id}|${b.id}` : `${b.id}|${a.id}`;
    const list = edgeLines.get(key) || [lineId];
    if (list.length <= 1) return { x1: a.x, y1: a.y, x2: b.x, y2: b.y };

    const idx = list.indexOf(lineId);
    const shift = (idx - (list.length - 1) / 2) * (mapMetrics.strokeW * 1.15);
    // Consistent canonical normal using sorted endpoints
    const p1 = a.id < b.id ? a : b;
    const p2 = a.id < b.id ? b : a;
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len;
    const ny = dx / len;
    return {
      x1: a.x + nx * shift,
      y1: a.y + ny * shift,
      x2: b.x + nx * shift,
      y2: b.y + ny * shift
    };
  }

  function renderMap() {
    computeMapLayout();
    svg.setAttribute("viewBox", `${view.baseX} ${view.baseY} ${view.baseW} ${view.baseH}`);
    resetViewTransform();

    layerTracks.innerHTML = "";
    layerRoute.innerHTML = "";
    layerStations.innerHTML = "";
    layerLabels.innerHTML = "";
    layerPins.innerHTML = "";
    renderedLineGroups = new Map();
    renderedStationGroups = new Map();
    stationLabelDir = new Map();

    const edgeLines = buildEdgeParallelOffsets();
    const { strokeW, stationR, transferR, fontSize, unit } = mapMetrics;

    // Collect incident segments per station for smart label placement
    const incidentDirs = new Map();
    for (const st of graph.stations) incidentDirs.set(st.id, []);

    // 1. Draw lines
    for (const ln of graph.lines) {
      const grp = svgEl("g", { class: "track-group", "data-line-id": ln.id });
      const arr = ln.stations || [];
      const ec = ln.loop ? arr.length : Math.max(0, arr.length - 1);

      // Subtle casing stroke underneath
      const casingG = svgEl("g");
      const mainG = svgEl("g");

      for (let i = 0; i < ec; i++) {
        const a = graph.stationById.get(arr[i]);
        const b = graph.stationById.get(arr[(i + 1) % arr.length]);
        if (!a || !b) continue;
        const seg = getOffsetSegment(a, b, ln.id, edgeLines);

        casingG.appendChild(svgEl("line", {
          x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
          stroke: "var(--halo)",
          "stroke-width": strokeW + 2.6 * unit,
          "stroke-linecap": "round"
        }));
        mainG.appendChild(svgEl("line", {
          x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
          stroke: ln.color || "#2563eb",
          "stroke-width": strokeW,
          "stroke-linecap": "round"
        }));

        const angAB = Math.atan2(b.y - a.y, b.x - a.x);
        const angBA = Math.atan2(a.y - b.y, a.x - b.x);
        incidentDirs.get(a.id).push(angAB);
        incidentDirs.get(b.id).push(angBA);
      }

      grp.appendChild(casingG);
      grp.appendChild(mainG);
      layerTracks.appendChild(grp);
      renderedLineGroups.set(ln.id, grp);
    }

    // 2. Draw stations
    for (let sIdx = 0; sIdx < graph.stations.length; sIdx++) {
      const st = graph.stations[sIdx];
      const sls = graph.linesAtStation[sIdx];
      const isTransfer = sls.length >= 2;
      const g = svgEl("g", {
        class: "station-node",
        "data-station-id": st.id,
        role: "button",
        tabindex: "0",
        "aria-label": st.name + (isTransfer ? " (换乘站)" : "")
      });

      // Invisible generous hit area
      g.appendChild(svgEl("circle", {
        cx: st.x, cy: st.y, r: Math.max(transferR + 7 * unit, 13 * unit),
        fill: "transparent"
      }));

      if (isTransfer) {
        const dotG = svgEl("g", { class: "station-dot" });
        dotG.appendChild(svgEl("circle", {
          cx: st.x, cy: st.y, r: transferR + 1.4 * unit,
          fill: "var(--surface)",
          stroke: "var(--text)",
          "stroke-width": Math.max(1.8, 2.5 * unit)
        }));
        dotG.appendChild(svgEl("circle", {
          cx: st.x, cy: st.y, r: transferR * 0.42,
          fill: "var(--text)"
        }));
        g.appendChild(dotG);
      } else {
        const lineColor = sls.length === 1 ? (graph.lines[sls[0].lineIdx].color || "#2563eb") : "#94a3b8";
        g.appendChild(svgEl("circle", {
          class: "station-dot",
          cx: st.x, cy: st.y, r: stationR,
          fill: "var(--surface)",
          stroke: lineColor,
          "stroke-width": Math.max(1.8, 2.5 * unit)
        }));
      }

      const title = svgEl("title");
      const lineNames = sls.map((x) => graph.lines[x.lineIdx].name).join(" / ");
      title.textContent = lineNames ? `${st.name} (${lineNames})` : `${st.name} (未连通)`;
      g.appendChild(title);

      g.addEventListener("click", (ev) => {
        if (view.moved) return;
        ev.stopPropagation();
        handleStationClick(st.id);
      });
      g.addEventListener("keydown", (ev) => {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          handleStationClick(st.id);
        }
      });

      layerStations.appendChild(g);
      renderedStationGroups.set(st.id, g);
    }

    // 3. Smart anti-overlap station labels
    const placedBoxes = [];
    // Place transfer stations first so important hubs get the cleanest spots
    const labelOrder = graph.stations.map((st, idx) => ({
      st, idx, isTransfer: graph.linesAtStation[idx].length >= 2
    })).sort((a, b) => (b.isTransfer - a.isTransfer) || (a.st.y - b.st.y));

    const padDist = transferR + 5.5 * unit;
    const candidates = [
      { dx: 0, dy: -padDist, anchor: "middle", base: "auto", ang: -Math.PI / 2 },
      { dx: 0, dy: padDist + fontSize * 0.88, anchor: "middle", base: "auto", ang: Math.PI / 2 },
      { dx: padDist + 2 * unit, dy: fontSize * 0.34, anchor: "start", base: "auto", ang: 0 },
      { dx: -(padDist + 2 * unit), dy: fontSize * 0.34, anchor: "end", base: "auto", ang: Math.PI },
      { dx: padDist * 0.85, dy: -padDist * 0.72, anchor: "start", base: "auto", ang: -Math.PI / 4 },
      { dx: padDist * 0.85, dy: padDist * 0.72 + fontSize * 0.75, anchor: "start", base: "auto", ang: Math.PI / 4 },
      { dx: -padDist * 0.85, dy: -padDist * 0.72, anchor: "end", base: "auto", ang: -3 * Math.PI / 4 },
      { dx: -padDist * 0.85, dy: padDist * 0.72 + fontSize * 0.75, anchor: "end", base: "auto", ang: 3 * Math.PI / 4 }
    ];

    function estimateLabelWidth(text, fs) {
      let w = 0;
      for (let i = 0; i < text.length; i++) {
        w += text.charCodeAt(i) > 127 ? fs * 1.02 : fs * 0.62;
      }
      return w;
    }

    function rectOverlapArea(a, b) {
      const ox = Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1));
      const oy = Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
      return ox * oy;
    }

    for (const item of labelOrder) {
      const { st, isTransfer } = item;
      const fs = isTransfer ? fontSize * 1.06 : fontSize * 0.96;
      const lw = estimateLabelWidth(st.name, fs);
      const lh = fs * 1.15;
      const dirs = incidentDirs.get(st.id) || [];

      let bestCand = candidates[0];
      let bestBox = null;
      let bestScore = Infinity;

      for (let ci = 0; ci < candidates.length; ci++) {
        const c = candidates[ci];
        const tx = st.x + c.dx;
        const ty = st.y + c.dy;
        let x1 = tx;
        if (c.anchor === "middle") x1 = tx - lw / 2;
        else if (c.anchor === "end") x1 = tx - lw;
        const box = { x1: x1 - 2, y1: ty - lh, x2: x1 + lw + 2, y2: ty + 2 };

        let score = ci * 0.15; // slight preference for cardinal placements

        // Penalize aligning with an incident track direction
        for (let di = 0; di < dirs.length; di++) {
          let diff = Math.abs(c.ang - dirs[di]);
          if (diff > Math.PI) diff = 2 * Math.PI - diff;
          if (diff < 0.45) score += 28 * (0.45 - diff);
        }

        // Penalize overlapping other station dots
        for (let si = 0; si < graph.stations.length; si++) {
          const o = graph.stations[si];
          if (o.id === st.id) continue;
          const oBox = { x1: o.x - transferR, y1: o.y - transferR, x2: o.x + transferR, y2: o.y + transferR };
          const area = rectOverlapArea(box, oBox);
          if (area > 0) score += 50 + area * 0.4;
        }

        // Penalize overlapping already-placed labels
        for (let pi = 0; pi < placedBoxes.length; pi++) {
          const area = rectOverlapArea(box, placedBoxes[pi]);
          if (area > 0) score += 80 + area * 0.8;
        }

        if (score < bestScore) {
          bestScore = score;
          bestCand = c;
          bestBox = box;
        }
      }

      placedBoxes.push(bestBox);
      stationLabelDir.set(st.id, bestCand.dy < 0 ? -1 : 1);
      const lbl = svgEl("text", {
        class: "station-label" + (isTransfer ? " transfer-label" : ""),
        "data-label-for": st.id,
        x: st.x + bestCand.dx,
        y: st.y + bestCand.dy,
        "text-anchor": bestCand.anchor,
        "font-size": fs,
        "stroke-width": Math.max(2.4, 3.6 * unit)
      });
      lbl.textContent = st.name;
      layerLabels.appendChild(lbl);
    }
  }

  function renderMapHighlights() {
    layerRoute.innerHTML = "";
    layerPins.innerHTML = "";

    const route = state.currentRoute;
    const activeLineId = state.activeLineId;
    const { strokeW, transferR, unit } = mapMetrics;

    const hasRoute = !!(route && route.path && route.path.length > 0);
    const hasFilter = !hasRoute && !!activeLineId;

    // 1. Dimming for tracks
    for (const [lineId, grp] of renderedLineGroups.entries()) {
      if (hasRoute) {
        grp.classList.add("dimmed");
      } else if (hasFilter) {
        grp.classList.toggle("dimmed", lineId !== activeLineId);
      } else {
        grp.classList.remove("dimmed");
      }
    }

    // 2. Dimming for stations and labels
    const highlightStations = new Set();
    if (hasRoute) {
      for (const sid of route.path) highlightStations.add(sid);
    } else if (hasFilter) {
      const ln = graph.lineById.get(activeLineId);
      if (ln) for (const sid of ln.stations) highlightStations.add(sid);
    }
    if (state.originId) highlightStations.add(state.originId);
    if (state.destId) highlightStations.add(state.destId);

    const shouldDimStations = hasRoute || hasFilter;
    for (const [sid, grp] of renderedStationGroups.entries()) {
      grp.classList.toggle("dimmed", shouldDimStations && !highlightStations.has(sid));
    }
    const labelEls = layerLabels.querySelectorAll(".station-label");
    labelEls.forEach((el) => {
      const sid = el.getAttribute("data-label-for");
      el.style.opacity = shouldDimStations && !highlightStations.has(sid) ? "0.28" : "1";
    });

    // 3. Draw highlighted route segments
    if (hasRoute && route.legs.length > 0) {
      const edgeLines = buildEdgeParallelOffsets();
      // Map path slices to each leg
      let cursor = 0;
      const transferStationsOnRoute = new Set();
      for (let li = 0; li < route.legs.length; li++) {
        const leg = route.legs[li];
        const ln = graph.lineById.get(leg.line);
        const color = ln ? ln.color : "#2563eb";
        if (li > 0) transferStationsOnRoute.add(leg.from);

        // Find end index in route.path starting from cursor + 1
        let endIdx = cursor + 1;
        while (endIdx < route.path.length && route.path[endIdx] !== leg.to) {
          endIdx++;
        }

        const segCoords = [];
        for (let i = cursor; i < endIdx; i++) {
          const a = graph.stationById.get(route.path[i]);
          const b = graph.stationById.get(route.path[i + 1]);
          if (!a || !b) continue;
          const seg = getOffsetSegment(a, b, leg.line, edgeLines);
          segCoords.push(seg);
        }

        // Glow + solid line + animated directional dash
        for (const seg of segCoords) {
          layerRoute.appendChild(svgEl("line", {
            x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
            stroke: color,
            "stroke-opacity": "0.25",
            "stroke-width": strokeW * 2.5,
            "stroke-linecap": "round"
          }));
          layerRoute.appendChild(svgEl("line", {
            x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
            stroke: color,
            "stroke-width": strokeW * 1.35,
            "stroke-linecap": "round"
          }));
          layerRoute.appendChild(svgEl("line", {
            class: "route-flow",
            x1: seg.x1, y1: seg.y1, x2: seg.x2, y2: seg.y2,
            stroke: "#ffffff",
            "stroke-opacity": "0.75",
            "stroke-width": Math.max(1.5, strokeW * 0.36),
            "stroke-linecap": "round"
          }));
        }

        cursor = endIdx;
      }

      // Emphasize transfer hubs along the route
      for (const sid of transferStationsOnRoute) {
        const st = graph.stationById.get(sid);
        if (!st) continue;
        layerPins.appendChild(svgEl("circle", {
          cx: st.x, cy: st.y, r: transferR + 4.5 * unit,
          fill: "none",
          stroke: "var(--accent)",
          "stroke-width": Math.max(2, 2.5 * unit),
          "stroke-dasharray": `${3.5 * unit} ${2.5 * unit}`
        }));
      }
    }

    // 4. Origin & Destination pins (placed opposite the station label to avoid covering text)
    function drawPin(stationId, label, colorVar, offsetX) {
      const st = graph.stationById.get(stationId);
      if (!st) return;
      const r = Math.max(8.5, 11 * unit);
      const lblDir = stationLabelDir.get(stationId) || -1;
      const pinDir = lblDir < 0 ? 1 : -1;
      const px = st.x + offsetX;
      const py = st.y + pinDir * (transferR + r + 5 * unit);

      layerPins.appendChild(svgEl("circle", {
        class: "pin-pulse",
        cx: st.x, cy: st.y, r: transferR + 2 * unit,
        fill: colorVar,
        "fill-opacity": "0.35"
      }));

      // Pin stem + badge
      layerPins.appendChild(svgEl("line", {
        x1: st.x, y1: st.y + pinDir * transferR,
        x2: px, y2: py - pinDir * r * 0.7,
        stroke: colorVar,
        "stroke-width": Math.max(1.8, 2.2 * unit)
      }));
      layerPins.appendChild(svgEl("circle", {
        cx: px, cy: py, r: r,
        fill: colorVar,
        stroke: "#ffffff",
        "stroke-width": Math.max(1.6, 2 * unit)
      }));
      const txt = svgEl("text", {
        x: px, y: py + r * 0.36,
        "text-anchor": "middle",
        fill: "#ffffff",
        "font-size": r * 1.05,
        "font-weight": "700",
        "font-family": "var(--font)",
        "pointer-events": "none"
      });
      txt.textContent = label;
      layerPins.appendChild(txt);
    }

    const samePin = state.originId && state.originId === state.destId;
    if (state.originId) {
      drawPin(state.originId, "起", "var(--origin)", samePin ? -11 * unit : 0);
    }
    if (state.destId) {
      drawPin(state.destId, "终", "var(--dest)", samePin ? 11 * unit : 0);
    }
  }

  // =========================================================================
  // Pan & Zoom Controls
  // =========================================================================
  function applyViewTransform() {
    gViewport.setAttribute("transform", `translate(${view.tx}, ${view.ty}) scale(${view.scale})`);
  }

  function resetViewTransform() {
    view.scale = 1;
    view.tx = 0;
    view.ty = 0;
    applyViewTransform();
  }

  function zoomAroundCenter(factor) {
    const cx = view.baseX + view.baseW / 2;
    const cy = view.baseY + view.baseH / 2;
    zoomAtSvgPoint(cx, cy, factor);
  }

  function zoomAtSvgPoint(px, py, factor) {
    const newScale = Math.max(view.minScale, Math.min(view.maxScale, view.scale * factor));
    const ratio = newScale / view.scale;
    view.tx = px - (px - view.tx) * ratio;
    view.ty = py - (py - view.ty) * ratio;
    view.scale = newScale;
    applyViewTransform();
  }

  function clientToSvg(clientX, clientY) {
    const rect = svg.getBoundingClientRect();
    const rx = (clientX - rect.left) / Math.max(1, rect.width);
    const ry = (clientY - rect.top) / Math.max(1, rect.height);
    // Account for preserveAspectRatio="xMidYMid meet"
    const scaleX = rect.width / view.baseW;
    const scaleY = rect.height / view.baseH;
    const fit = Math.min(scaleX, scaleY);
    const drawnW = view.baseW * fit;
    const drawnH = view.baseH * fit;
    const offX = (rect.width - drawnW) / 2;
    const offY = (rect.height - drawnH) / 2;
    return {
      x: view.baseX + (clientX - rect.left - offX) / fit,
      y: view.baseY + (clientY - rect.top - offY) / fit
    };
  }

  svg.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const pt = clientToSvg(ev.clientX, ev.clientY);
    const factor = ev.deltaY < 0 ? 1.16 : 1 / 1.16;
    zoomAtSvgPoint(pt.x, pt.y, factor);
  }, { passive: false });

  svg.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0) return;
    view.isPanning = true;
    view.moved = false;
    view.startX = ev.clientX;
    view.startY = ev.clientY;
    view.startTx = view.tx;
    view.startTy = view.ty;
    svg.classList.add("panning");
  });

  window.addEventListener("pointermove", (ev) => {
    if (!view.isPanning) return;
    const dx = ev.clientX - view.startX;
    const dy = ev.clientY - view.startY;
    if (Math.hypot(dx, dy) > 4) view.moved = true;
    if (!view.moved) return;
    const rect = svg.getBoundingClientRect();
    const fit = Math.min(rect.width / view.baseW, rect.height / view.baseH) || 1;
    view.tx = view.startTx + dx / fit;
    view.ty = view.startTy + dy / fit;
    applyViewTransform();
  });

  window.addEventListener("pointerup", () => {
    if (!view.isPanning) return;
    view.isPanning = false;
    svg.classList.remove("panning");
    setTimeout(() => { view.moved = false; }, 0);
  });

  document.getElementById("zoom-in").addEventListener("click", () => zoomAroundCenter(1.25));
  document.getElementById("zoom-out").addEventListener("click", () => zoomAroundCenter(1 / 1.25));
  document.getElementById("zoom-reset").addEventListener("click", resetViewTransform);

  // =========================================================================
  // Legend & Route Summary Rendering
  // =========================================================================
  function renderLegend() {
    elLegend.innerHTML = "";
    for (const ln of graph.lines) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "legend-chip" + (state.activeLineId === ln.id ? " active" : "");
      btn.innerHTML = `<span class="legend-swatch" style="background:${escapeHtml(ln.color || "#2563eb")}"></span>${escapeHtml(ln.name)}`;
      btn.addEventListener("click", () => {
        state.activeLineId = state.activeLineId === ln.id ? null : ln.id;
        renderLegend();
        renderMapHighlights();
      });
      elLegend.appendChild(btn);
    }
  }

  function renderSummary() {
    if (!state.originId || !state.destId) {
      elSummary.removeAttribute("data-total-time");
      elSummary.removeAttribute("data-transfers");
      const hint = !state.originId
        ? "请在上方输入站名，或直接点击右侧地图上的站点选择<strong>起点</strong>与<strong>终点</strong>。"
        : `已选择起点 <strong>${escapeHtml(graph.stationById.get(state.originId).name)}</strong>，请继续选择终点站。`;
      elSummary.innerHTML = `<div class="empty-state"><div class="empty-title">规划您的地铁行程</div><div>${hint}</div></div>`;
      return;
    }

    const res = state.currentRoute;
    if (!res) {
      elSummary.removeAttribute("data-total-time");
      elSummary.removeAttribute("data-transfers");
      const oName = graph.stationById.get(state.originId)?.name || state.originId;
      const dName = graph.stationById.get(state.destId)?.name || state.destId;
      elSummary.innerHTML = `
        <div class="error-state">
          <strong>无法到达</strong>
          <div>从「${escapeHtml(oName)}」到「${escapeHtml(dName)}」暂无连通的轨道交通路线。</div>
        </div>`;
      return;
    }

    elSummary.setAttribute("data-total-time", String(res.totalTime));
    elSummary.setAttribute("data-transfers", String(res.transfers));

    if (res.legs.length === 0) {
      const sName = graph.stationById.get(state.originId)?.name || state.originId;
      elSummary.innerHTML = `
        <div class="summary-card">
          <div class="summary-metrics">
            <div class="metric"><div class="metric-val">0<span>分钟</span></div><div class="metric-label">总耗时</div></div>
            <div class="metric"><div class="metric-val">0<span>次</span></div><div class="metric-label">换乘</div></div>
            <div class="metric"><div class="metric-val">0<span>站</span></div><div class="metric-label">乘车区间</div></div>
          </div>
          <div class="legs-list">
            <div style="font-size:13px;color:var(--text-2);">起点与终点均为 <strong>${escapeHtml(sName)}</strong>，无需乘车。</div>
          </div>
        </div>`;
      return;
    }

    const totalStops = Math.max(0, res.path.length - 1);
    let legsHtml = "";
    let cursor = 0;

    for (let i = 0; i < res.legs.length; i++) {
      const leg = res.legs[i];
      const ln = graph.lineById.get(leg.line);
      const lineName = ln ? ln.name : leg.line;
      const lineColor = ln ? ln.color : "#2563eb";
      const fromName = graph.stationById.get(leg.from)?.name || leg.from;
      const toName = graph.stationById.get(leg.to)?.name || leg.to;

      // Extract stops & ride time for this leg from path
      let endIdx = cursor + 1;
      while (endIdx < res.path.length && res.path[endIdx] !== leg.to) endIdx++;
      const legPathIds = res.path.slice(cursor, endIdx + 1);
      const stopCount = legPathIds.length - 1;
      let legRideTime = 0;
      for (let k = 0; k < legPathIds.length - 1; k++) {
        legRideTime += graph.segTimeMap.get(`${leg.line}|${legPathIds[k]}|${legPathIds[k + 1]}`) || 0;
      }
      cursor = endIdx;

      if (i > 0) {
        const sIdx = graph.stationIdxById.get(leg.from);
        const tMins = sIdx !== undefined ? graph.transferCostByStation[sIdx] : 0;
        legsHtml += `
          <div class="transfer-banner">
            <span class="transfer-icon" aria-hidden="true">换</span>
            <span>在 <strong>${escapeHtml(fromName)}</strong> 站换乘 <strong>${escapeHtml(lineName)}</strong>，约 ${tMins} 分钟</span>
          </div>`;
      }

      const middleStops = legPathIds.slice(1, -1).map((id) => graph.stationById.get(id)?.name || id);
      const middleText = middleStops.length > 0
        ? `<div class="leg-stops-detail">途经：${middleStops.map(escapeHtml).join(" · ")}</div>`
        : "";

      legsHtml += `
        <div class="leg-card" style="--line-color:${escapeHtml(lineColor)}">
          <div class="leg-rail" aria-hidden="true">
            <span class="rail-dot"></span>
            <span class="rail-bar"></span>
            <span class="rail-dot"></span>
          </div>
          <div class="leg-body">
            <div class="leg-head">
              <span class="line-pill">${escapeHtml(lineName)}</span>
              <span class="leg-meta">经过 ${stopCount} 站 · 约 ${legRideTime} 分钟</span>
            </div>
            <div class="leg-endpoints">
              <span>${escapeHtml(fromName)}</span>
              <span class="leg-arrow">&rarr;</span>
              <span>${escapeHtml(toName)}</span>
            </div>
            ${middleText}
          </div>
        </div>`;
    }

    elSummary.innerHTML = `
      <div class="summary-card">
        <div class="summary-metrics">
          <div class="metric"><div class="metric-val">${res.totalTime}<span>分钟</span></div><div class="metric-label">预计总耗时</div></div>
          <div class="metric"><div class="metric-val">${res.transfers}<span>次</span></div><div class="metric-label">换乘次数</div></div>
          <div class="metric"><div class="metric-val">${totalStops}<span>站</span></div><div class="metric-label">总经过站数</div></div>
        </div>
        <div class="legs-list">${legsHtml}</div>
      </div>`;
  }

  // =========================================================================
  // Selection, Planning & Autocomplete Interactions
  // =========================================================================
  function syncClearButtons() {
    elClearOrigin.classList.toggle("visible", elOriginInput.value.length > 0);
    elClearDest.classList.toggle("visible", elDestInput.value.length > 0);
  }

  function replan() {
    if (state.originId && state.destId) {
      state.currentRoute = computeRoute(graph, state.originId, state.destId, state.mode);
    } else {
      state.currentRoute = null;
    }
    syncClearButtons();
    renderSummary();
    renderMapHighlights();
  }

  function setOrigin(id) {
    state.originId = id;
    elOriginInput.value = id ? (graph.stationById.get(id)?.name || "") : "";
    replan();
  }

  function setDest(id) {
    state.destId = id;
    elDestInput.value = id ? (graph.stationById.get(id)?.name || "") : "";
    replan();
  }

  function handleStationClick(stationId) {
    closeAllSuggestions();
    if (!state.originId) {
      setOrigin(stationId);
    } else if (!state.destId) {
      setDest(stationId);
    } else {
      // Both already set -> restart from origin
      state.originId = stationId;
      state.destId = null;
      elOriginInput.value = graph.stationById.get(stationId)?.name || "";
      elDestInput.value = "";
      replan();
    }
  }

  function setMode(mode) {
    state.mode = mode === "transfers" ? "transfers" : "time";
    elModeTime.classList.toggle("active", state.mode === "time");
    elModeTime.setAttribute("aria-pressed", String(state.mode === "time"));
    elModeTransfers.classList.toggle("active", state.mode === "transfers");
    elModeTransfers.setAttribute("aria-pressed", String(state.mode === "transfers"));
    replan();
  }

  elModeTime.addEventListener("click", () => setMode("time"));
  elModeTransfers.addEventListener("click", () => setMode("transfers"));

  elSwapBtn.addEventListener("click", () => {
    closeAllSuggestions();
    const tmpId = state.originId;
    const tmpVal = elOriginInput.value;
    state.originId = state.destId;
    state.destId = tmpId;
    elOriginInput.value = elDestInput.value;
    elDestInput.value = tmpVal;
    replan();
  });

  elClearOrigin.addEventListener("click", () => {
    closeAllSuggestions();
    setOrigin(null);
    elOriginInput.focus();
  });

  elClearDest.addEventListener("click", () => {
    closeAllSuggestions();
    setDest(null);
    elDestInput.focus();
  });

  // Autocomplete wiring
  function setupAutocomplete(inputEl, listEl, onSelect, onClearId) {
    let items = [];
    let highlightIdx = -1;

    function close() {
      listEl.classList.remove("open");
      listEl.innerHTML = "";
      items = [];
      highlightIdx = -1;
    }

    function filterStations(query) {
      const q = query.trim().toLowerCase();
      if (!q) return graph.stations.slice(0, 10);
      const exact = [];
      const prefix = [];
      const contains = [];
      for (const st of graph.stations) {
        const name = st.name.toLowerCase();
        const id = st.id.toLowerCase();
        if (name === q || id === q) exact.push(st);
        else if (name.startsWith(q) || id.startsWith(q)) prefix.push(st);
        else if (name.includes(q) || id.includes(q)) contains.push(st);
      }
      return exact.concat(prefix, contains).slice(0, 12);
    }

    function renderList() {
      const matches = filterStations(inputEl.value);
      items = matches;
      highlightIdx = matches.length > 0 ? 0 : -1;
      listEl.innerHTML = "";
      if (matches.length === 0) {
        listEl.classList.remove("open");
        return;
      }
      matches.forEach((st, idx) => {
        const li = document.createElement("li");
        li.className = "suggestion-item" + (idx === highlightIdx ? " highlighted" : "");
        li.setAttribute("role", "option");
        const sIdx = graph.stationIdxById.get(st.id);
        const dots = (graph.linesAtStation[sIdx] || [])
          .map((x) => `<span class="mini-dot" style="background:${escapeHtml(graph.lines[x.lineIdx].color || "#2563eb")}"></span>`)
          .join("");
        li.innerHTML = `<span>${escapeHtml(st.name)}</span><span class="suggestion-lines">${dots}</span>`;
        li.addEventListener("mousedown", (ev) => {
          ev.preventDefault();
          onSelect(st.id);
          close();
        });
        listEl.appendChild(li);
      });
      listEl.classList.add("open");
    }

    function updateHighlight() {
      const children = listEl.children;
      for (let i = 0; i < children.length; i++) {
        children[i].classList.toggle("highlighted", i === highlightIdx);
      }
      if (highlightIdx >= 0 && children[highlightIdx]) {
        children[highlightIdx].scrollIntoView({ block: "nearest" });
      }
    }

    inputEl.addEventListener("focus", renderList);
    inputEl.addEventListener("input", () => {
      syncClearButtons();
      const q = inputEl.value.trim();
      if (!q) {
        onClearId();
      } else {
        // Check if current selection no longer matches text
        const exact = graph.stations.find((s) => s.name === q);
        if (!exact) onClearId();
      }
      renderList();
    });

    inputEl.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowDown") {
        ev.preventDefault();
        if (!listEl.classList.contains("open")) renderList();
        else if (items.length > 0) {
          highlightIdx = (highlightIdx + 1) % items.length;
          updateHighlight();
        }
      } else if (ev.key === "ArrowUp") {
        ev.preventDefault();
        if (items.length > 0) {
          highlightIdx = (highlightIdx - 1 + items.length) % items.length;
          updateHighlight();
        }
      } else if (ev.key === "Enter") {
        ev.preventDefault();
        const q = inputEl.value.trim();
        const exact = graph.stations.find((s) => s.name === q || s.id === q);
        if (exact) {
          onSelect(exact.id);
          close();
        } else if (highlightIdx >= 0 && items[highlightIdx]) {
          onSelect(items[highlightIdx].id);
          close();
        } else {
          const matches = filterStations(q);
          if (matches.length > 0) {
            onSelect(matches[0].id);
            close();
          }
        }
      } else if (ev.key === "Escape") {
        close();
      }
    });

    inputEl.addEventListener("blur", () => {
      setTimeout(close, 120);
    });

    return { close };
  }

  const acOrigin = setupAutocomplete(
    elOriginInput,
    elOriginSug,
    (id) => setOrigin(id),
    () => { if (state.originId !== null) { state.originId = null; replan(); } }
  );
  const acDest = setupAutocomplete(
    elDestInput,
    elDestSug,
    (id) => setDest(id),
    () => { if (state.destId !== null) { state.destId = null; replan(); } }
  );

  function closeAllSuggestions() {
    acOrigin.close();
    acDest.close();
  }

  // Theme toggle
  const elThemeIcon = document.getElementById("theme-icon");
  const SUN_SVG = '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>';
  const MOON_SVG = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

  function isEffectiveDark() {
    const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    return state.theme === "dark" || (state.theme === "auto" && prefersDark);
  }

  function updateThemeIcon() {
    const dark = isEffectiveDark();
    elThemeIcon.innerHTML = dark ? SUN_SVG : MOON_SVG;
    elThemeBtn.title = dark ? "切换到浅色模式" : "切换到深色模式";
  }

  elThemeBtn.addEventListener("click", () => {
    state.theme = isEffectiveDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", state.theme);
    updateThemeIcon();
  });

  if (window.matchMedia) {
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeIcon);
  }
  updateThemeIcon();

  // =========================================================================
  // Network Loader & Public Benchmark Interface (window.metroBench)
  // =========================================================================
  function loadNetwork(network) {
    graph = buildGraph(network);
    state.originId = null;
    state.destId = null;
    state.currentRoute = null;
    state.activeLineId = null;
    elOriginInput.value = "";
    elDestInput.value = "";
    closeAllSuggestions();

    elTitle.textContent = network.name || "城市轨道交通";
    elStats.textContent = `${graph.stations.length} 站 · ${graph.lines.length} 条线路`;

    renderMap();
    renderLegend();
    replan();
  }

  window.metroBench = {
    loadNetwork(network) {
      loadNetwork(network);
    },
    route(fromId, toId, mode) {
      return computeRoute(graph, fromId, toId, mode || "time");
    }
  };

  // Initialize with embedded sample network
  loadNetwork(DEFAULT_NETWORK);
})();
</script>
</body>
</html>
